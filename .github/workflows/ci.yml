name: CI

on:
  push:
    branches: [main, Ariyan-Dev]
  pull_request:
    branches: [main, Ariyan-Dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/pawtato-test
      JWT_SECRET: ci-test-jwt-secret-please-change
      JWT_EXPIRES: 1d
      REFRESH_SECRET: ci-test-refresh-secret-change
      REFRESH_EXPIRES: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pawtato-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
