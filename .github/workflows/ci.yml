name: CI

on:
  push:
    branches: [main, Ariyan-Dev]
  pull_request:
    branches: [main, Ariyan-Dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/pawtato-test
      JWT_SECRET: ci-test-jwt-secret-please-change
      JWT_EXPIRES: 1d
      REFRESH_SECRET: ci-test-refresh-secret-change
      REFRESH_EXPIRES: 7d

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --ci
